<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掲示板</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="board-container">
        <div class="mess">
            <form action="" method="post">
                <textarea name="message" rows="5" placeholder="今の気分は？"></textarea>
                <div class="mess-actions">
                    <button type="submit">投稿</button>
                </div>
            </form>
        </div>
        <div class="post">
            <div class="post-header">
                <img src="member_image/noimage.jpg" alt="" width="48" height="48">
                <span>投稿者: User1</span>
                <span><time datetime="2024-12-23">2024-12-23</time></span>
                <div class="post-info">
                    <span>
                    <button class="pushDelete"><i class="fa-solid fa-trash warning"></i></button>
                    </span>
                </div>
            </div>
            <div class="post-content">
                これはサンプルの投稿内容です。
            </div>
            <div class="post-actions">
                <button class="pushLike">
                <i class="fa-solid fa-heart fa-red"></i></button><span class="like-count">10</span>
                <button class="pushComment" onclick="reply_open(4);">コメント</button>
                <div class="modal">
                    <div class="replys" id="post4">
                        <form action="" method="post">
                            <textarea name="reply" rows="10" placeholder="コメント">中身のサンプル</textarea>
                            <button type="submit">書き込み</button>
                            <button onclick="reply_open(4);return false;">キャンセル</button>
                            <input type="hidden" name="4">
                        </form>
                    </div>
                </div>
            </div>
            <div class="comments">
                <div class="comment">
                    <div class="comment-header">
                        <span>コメント者: User2</span>
                        <span><time datetime="2024-12-23">2024-12-23</time></span>
                    </div>
                    <div class="comment-content">
                        これはサンプルのコメント内容です。
                    </div>
                    <div class="comment-actions">
                        <button class="pushComLike">
                        <i class="fa-solid fa-heart fa-red"></i></button>
                    </div>
                </div>
                <div class="comment">
                    <div class="comment-header">
                        <span>コメント者: User3</span>
                        <span><time datetime="2024-12-23">2024-12-23</time></span>
                    </div>
                    <div class="comment-content">
                        これはサンプルのコメント内容です。
                  </div>

                  <div class="comment-actions">
                    <button class="pushComLike">
                    <i class="fa-regular fa-heart"></i></button>
                </div>
            </div>
        </div>
        <div class="post">
            <div class="post-header">
                <img src="member_image/noimage.jpg" alt="" width="48" height="48">
                <span>投稿者: User2</span>
                <span><time datetime="2024-12-22">2024-12-22</time></span>
            </div>
            <div class="post-content">
                これはサンプルの投稿内容です。
            </div>
            <div class="post-actions">
                <button class="pushLike">
                <i class="fa-solid fa-heart fa-red"></i></button>
                <button class="pushComment" onclick="reply_open(3);">コメント</button>
                <div class="modal">
                    <div class="replys" id="post3">
                        <form action="index.php" method="post">
                            <textarea name="reply" rows="10" placeholder="コメントを入力してください"></textarea>
                            <button type="submit">書き込み</button>
                            <button onclick="reply_open(3);return false;">キャンセル</button>
                            <input type="hidden" name="3">
                        </form>
                    </div>
                </div>
            </div>
            <div class="comments">
                <div class="comment">
                    <div class="comment-header">
                        <span>コメント者: User3</span>
                        <span><time datetime="2024-12-22">2024-12-22</time></span>
                    </div>
                    <div class="comment-content">
                        これはサンプルのコメント内容です。
                </div>

                <div class="comment-actions">
                    <button class="pushComLike">
                    <i class="fa-regular fa-heart"></i></button>
                </div>
            </div>
        </div>
    </div>
    <script>
        function reply_open(id) {
            var rep = document.getElementById("post"+id);
            rep.style.display = rep.style.display == "block" ? "none" : "flow";
            var parent = rep.parentNode;
            parent.style.display = parent.style.display == "block" ? "none" : "flow";
        }
    </script>
</body>
</html>
